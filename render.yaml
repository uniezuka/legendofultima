services:
  - type: web
    name: legendofultima-server
    runtime: node
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: CLIENT_ORIGIN
        value: https://legendofultima.workwithcyrose.dev
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: legendofultima-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: REQUIRE_SOCKET_AUTH
        value: "false"

databases:
  - name: legendofultima-db
    plan: free
