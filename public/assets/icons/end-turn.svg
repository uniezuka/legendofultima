<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- end turn - hourglass/arrow combo -->
  <!-- circle background -->
  <rect x="2" y="2" width="20" height="20" fill="#2a4a2a"/>
  <rect x="1" y="4" width="22" height="16" fill="#2a4a2a"/>
  <rect x="4" y="1" width="16" height="22" fill="#2a4a2a"/>
  <rect x="3" y="2" width="18" height="20" fill="#3a6a3a"/>
  <!-- forward arrow -->
  <rect x="6" y="11" width="10" height="2" fill="#88ff44"/>
  <rect x="14" y="8" width="2" height="8" fill="#88ff44"/>
  <rect x="14" y="8" width="4" height="2" fill="#88ff44"/>
  <rect x="14" y="14" width="4" height="2" fill="#88ff44"/>
  <!-- vertical bar (end of turn stop) -->
  <rect x="18" y="7" width="3" height="10" fill="#88ff44"/>
  <!-- text hint line -->
  <rect x="5" y="8" width="6" height="1" fill="#55cc22" opacity="0.7"/>
  <rect x="5" y="14" width="6" height="1" fill="#55cc22" opacity="0.7"/>
</svg>
