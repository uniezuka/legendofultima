<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <rect width="48" height="48" fill="#b8955a"/>
  <!-- stone blocks -->
  <rect x="1" y="1" width="22" height="14" fill="#c4a468"/>
  <rect x="25" y="1" width="22" height="14" fill="#aa8450"/>
  <rect x="1" y="17" width="14" height="14" fill="#aa8450"/>
  <rect x="17" y="17" width="14" height="14" fill="#c4a468"/>
  <rect x="33" y="17" width="14" height="14" fill="#aa8450"/>
  <rect x="1" y="33" width="22" height="14" fill="#c4a468"/>
  <rect x="25" y="33" width="22" height="14" fill="#aa8450"/>
  <!-- mortar lines horizontal -->
  <rect x="0" y="15" width="48" height="2" fill="#7a5a38"/>
  <rect x="0" y="31" width="48" height="2" fill="#7a5a38"/>
  <!-- mortar lines vertical -->
  <rect x="23" y="0" width="2" height="15" fill="#7a5a38"/>
  <rect x="15" y="17" width="2" height="14" fill="#7a5a38"/>
  <rect x="31" y="17" width="2" height="14" fill="#7a5a38"/>
  <rect x="23" y="33" width="2" height="15" fill="#7a5a38"/>
  <!-- subtle pebble details -->
  <rect x="8" y="5" width="3" height="2" fill="#9a7040" opacity="0.5"/>
  <rect x="30" y="7" width="3" height="2" fill="#d0b07a" opacity="0.5"/>
  <rect x="5" y="22" width="2" height="3" fill="#d0b07a" opacity="0.5"/>
  <rect x="38" y="24" width="3" height="2" fill="#9a7040" opacity="0.5"/>
  <rect x="10" y="38" width="3" height="2" fill="#9a7040" opacity="0.5"/>
  <rect x="34" y="40" width="2" height="3" fill="#d0b07a" opacity="0.5"/>
</svg>
