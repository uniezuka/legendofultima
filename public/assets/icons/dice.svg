<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- dice icon (showing 3 faces, corner view) -->
  <!-- top face -->
  <rect x="8" y="1" width="14" height="10" fill="#f0f0f0"/>
  <rect x="9" y="2" width="12" height="8" fill="#ffffff"/>
  <!-- top dots (5) -->
  <rect x="11" y="4" width="2" height="2" fill="#1a1a1a"/>
  <rect x="17" y="4" width="2" height="2" fill="#1a1a1a"/>
  <rect x="14" y="6" width="2" height="2" fill="#1a1a1a"/>
  <rect x="11" y="8" width="2" height="2" fill="#1a1a1a"/>
  <rect x="17" y="8" width="2" height="2" fill="#1a1a1a"/>
  <!-- left face -->
  <rect x="1" y="7" width="10" height="14" fill="#d8d8d8"/>
  <rect x="2" y="8" width="8" height="12" fill="#e8e8e8"/>
  <!-- left dots (3) -->
  <rect x="4" y="10" width="2" height="2" fill="#1a1a1a"/>
  <rect x="7" y="13" width="2" height="2" fill="#1a1a1a"/>
  <rect x="4" y="16" width="2" height="2" fill="#1a1a1a"/>
  <!-- right face -->
  <rect x="11" y="10" width="12" height="14" fill="#c0c0c0"/>
  <rect x="12" y="11" width="10" height="12" fill="#d0d0d0"/>
  <!-- right dots (1) -->
  <rect x="16" y="16" width="2" height="2" fill="#1a1a1a"/>
  <!-- edges -->
  <rect x="8" y="1" width="14" height="1" fill="#888888"/>
  <rect x="8" y="1" width="1" height="10" fill="#888888"/>
  <rect x="21" y="1" width="1" height="10" fill="#555555"/>
  <rect x="1" y="7" width="10" height="1" fill="#888888"/>
  <rect x="1" y="7" width="1" height="14" fill="#888888"/>
  <rect x="1" y="21" width="22" height="1" fill="#555555"/>
  <rect x="11" y="10" width="12" height="1" fill="#555555"/>
  <rect x="22" y="10" width="1" height="12" fill="#333333"/>
</svg>
