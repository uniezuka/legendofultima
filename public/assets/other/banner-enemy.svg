<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" shape-rendering="crispEdges">
  <!-- pole -->
  <rect x="14" y="2" width="4" height="44" fill="#8a6a30"/>
  <rect x="15" y="2" width="2" height="44" fill="#b08840"/>
  <!-- banner flag (red) -->
  <rect x="18" y="3" width="14" height="18" fill="#9a1a1a"/>
  <rect x="19" y="4" width="12" height="16" fill="#bb2222"/>
  <!-- flag swallow tail cut -->
  <rect x="27" y="12" width="5" height="6" fill="#1a0a0a"/>
  <!-- skull emblem on flag -->
  <rect x="21" y="6" width="8" height="7" fill="#dd4444"/>
  <rect x="22" y="7" width="6" height="5" fill="#ee5555"/>
  <!-- skull eyes -->
  <rect x="22" y="8" width="2" height="2" fill="#9a1a1a"/>
  <rect x="26" y="8" width="2" height="2" fill="#9a1a1a"/>
  <!-- skull teeth -->
  <rect x="22" y="11" width="2" height="2" fill="#9a1a1a"/>
  <rect x="24" y="11" width="2" height="2" fill="#dd4444"/>
  <rect x="26" y="11" width="2" height="2" fill="#9a1a1a"/>
  <!-- flag shine -->
  <rect x="20" y="5" width="4" height="2" fill="#ff8888" opacity="0.4"/>
  <!-- flag tip -->
  <rect x="14" y="0" width="4" height="4" fill="#c8a840"/>
  <rect x="15" y="0" width="2" height="3" fill="#f0d060"/>
  <!-- banner fringe at bottom -->
  <rect x="18" y="21" width="2" height="4" fill="#9a1a1a"/>
  <rect x="22" y="21" width="2" height="5" fill="#9a1a1a"/>
  <rect x="26" y="21" width="2" height="4" fill="#9a1a1a"/>
  <rect x="30" y="21" width="2" height="5" fill="#9a1a1a"/>
</svg>
