<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- sky/base -->
  <rect width="48" height="48" fill="#2a2a3a"/>
  <!-- ground rocky -->
  <rect x="0" y="36" width="48" height="12" fill="#5a5040"/>
  <rect x="4" y="38" width="8" height="4" fill="#6a6050" opacity="0.7"/>
  <rect x="20" y="40" width="6" height="4" fill="#4a4030" opacity="0.7"/>
  <rect x="36" y="38" width="8" height="4" fill="#6a6050" opacity="0.7"/>
  <!-- left mountain -->
  <rect x="0" y="22" width="24" height="14" fill="#6a6050"/>
  <rect x="4" y="14" width="16" height="10" fill="#7a7060"/>
  <rect x="8" y="8" width="8" height="8" fill="#8a8070"/>
  <rect x="10" y="3" width="4" height="6" fill="#9a9080"/>
  <!-- left mountain snow -->
  <rect x="9" y="5" width="6" height="4" fill="#d8d8d8"/>
  <rect x="10" y="3" width="4" height="4" fill="#eeeeee"/>
  <rect x="11" y="2" width="2" height="2" fill="#ffffff"/>
  <!-- left mountain shadow -->
  <rect x="16" y="12" width="4" height="8" fill="#5a5040" opacity="0.5"/>
  <rect x="18" y="20" width="6" height="8" fill="#4a4030" opacity="0.4"/>
  <!-- right mountain -->
  <rect x="28" y="18" width="20" height="18" fill="#706860"/>
  <rect x="32" y="10" width="12" height="10" fill="#807870"/>
  <rect x="36" y="4" width="4" height="8" fill="#908880"/>
  <!-- right mountain snow -->
  <rect x="35" y="6" width="6" height="4" fill="#d8d8d8"/>
  <rect x="36" y="4" width="4" height="4" fill="#eeeeee"/>
  <rect x="37" y="3" width="2" height="2" fill="#ffffff"/>
  <!-- right mountain shadow -->
  <rect x="40" y="14" width="4" height="10" fill="#4a4030" opacity="0.5"/>
  <!-- rock details -->
  <rect x="2" y="32" width="6" height="4" fill="#4a4035"/>
  <rect x="22" y="34" width="8" height="4" fill="#5a5040"/>
  <rect x="40" y="34" width="6" height="4" fill="#4a4035"/>
</svg>
