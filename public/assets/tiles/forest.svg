<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- ground -->
  <rect width="48" height="48" fill="#2a4a20"/>
  <rect x="0" y="34" width="48" height="14" fill="#1e3a18"/>
  <!-- roots/moss -->
  <rect x="0" y="38" width="8" height="4" fill="#3a5a28" opacity="0.6"/>
  <rect x="20" y="40" width="10" height="6" fill="#2e4e22" opacity="0.5"/>
  <rect x="38" y="36" width="10" height="6" fill="#3a5a28" opacity="0.6"/>
  <!-- left tree trunk -->
  <rect x="5" y="28" width="6" height="10" fill="#5a3a18"/>
  <rect x="6" y="29" width="1" height="8" fill="#7a5a28" opacity="0.6"/>
  <!-- left tree canopy layers -->
  <rect x="2" y="22" width="12" height="8" fill="#2d6a20"/>
  <rect x="0" y="16" width="16" height="8" fill="#3a7a2a"/>
  <rect x="2" y="10" width="12" height="8" fill="#3d8030"/>
  <rect x="4" y="5" width="8" height="7" fill="#48922e"/>
  <rect x="7" y="2" width="2" height="4" fill="#4aaa30"/>
  <!-- right tree trunk -->
  <rect x="33" y="28" width="6" height="10" fill="#5a3a18"/>
  <rect x="34" y="29" width="1" height="8" fill="#7a5a28" opacity="0.6"/>
  <!-- right tree canopy layers -->
  <rect x="28" y="22" width="16" height="8" fill="#2d6a20"/>
  <rect x="30" y="15" width="14" height="9" fill="#3a7a2a"/>
  <rect x="32" y="9" width="10" height="8" fill="#3d8030"/>
  <rect x="34" y="4" width="6" height="7" fill="#48922e"/>
  <rect x="36" y="1" width="2" height="4" fill="#4aaa30"/>
  <!-- small shrub center -->
  <rect x="18" y="34" width="12" height="6" fill="#2a5a20"/>
  <rect x="20" y="30" width="8" height="6" fill="#3a6a28"/>
  <!-- leaf highlights -->
  <rect x="4" y="8" width="4" height="2" fill="#5ab040" opacity="0.7"/>
  <rect x="34" y="11" width="4" height="2" fill="#5ab040" opacity="0.7"/>
  <rect x="2" y="18" width="3" height="2" fill="#5ab040" opacity="0.5"/>
</svg>
