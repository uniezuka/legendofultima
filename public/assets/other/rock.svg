<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" shape-rendering="crispEdges">
  <!-- shadow -->
  <rect x="6" y="28" width="28" height="4" fill="#1a1a1a" opacity="0.3"/>
  <!-- rock body -->
  <rect x="4" y="16" width="32" height="12" fill="#6a6a6a"/>
  <rect x="2" y="18" width="36" height="10" fill="#707070"/>
  <rect x="6" y="12" width="28" height="6" fill="#707070"/>
  <rect x="8" y="8" width="24" height="6" fill="#787878"/>
  <rect x="12" y="4" width="16" height="6" fill="#808080"/>
  <rect x="16" y="2" width="8" height="4" fill="#7a7a7a"/>
  <!-- rock face variations -->
  <rect x="6" y="14" width="10" height="4" fill="#686868"/>
  <rect x="22" y="16" width="12" height="4" fill="#747474"/>
  <rect x="10" y="20" width="8" height="4" fill="#686868"/>
  <rect x="24" y="22" width="8" height="4" fill="#747474"/>
  <!-- crack lines -->
  <rect x="16" y="10" width="2" height="8" fill="#555555" opacity="0.6"/>
  <rect x="16" y="18" width="1" height="6" fill="#555555" opacity="0.5"/>
  <rect x="26" y="14" width="1" height="6" fill="#555555" opacity="0.5"/>
  <rect x="10" y="16" width="1" height="5" fill="#555555" opacity="0.4"/>
  <!-- highlights -->
  <rect x="12" y="6" width="8" height="2" fill="#9a9a9a"/>
  <rect x="12" y="6" width="2" height="6" fill="#9a9a9a"/>
  <rect x="8" y="10" width="4" height="2" fill="#8a8a8a"/>
  <!-- moss patches -->
  <rect x="4" y="22" width="6" height="4" fill="#4a6a3a" opacity="0.5"/>
  <rect x="30" y="20" width="6" height="4" fill="#4a6a3a" opacity="0.4"/>
</svg>
