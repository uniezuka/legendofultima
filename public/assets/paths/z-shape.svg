<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- path tile base -->
  <rect width="48" height="48" fill="#1a1a1a"/>
  <!-- Z/S-shape path: top-left horizontal + diagonal + bottom-right horizontal -->
  <!-- top horizontal (left side) -->
  <rect x="0" y="0" width="34" height="20" fill="#b8955a"/>
  <rect x="0" y="1" width="34" height="18" fill="#c4a468"/>
  <!-- diagonal middle bridge -->
  <rect x="14" y="14" width="20" height="20" fill="#b8955a"/>
  <rect x="15" y="15" width="18" height="18" fill="#c4a468"/>
  <!-- bottom horizontal (right side) -->
  <rect x="14" y="28" width="34" height="20" fill="#b8955a"/>
  <rect x="14" y="29" width="34" height="18" fill="#c4a468"/>
  <!-- stone blocks top -->
  <rect x="1" y="2" width="16" height="6" fill="#aa8450"/>
  <rect x="19" y="2" width="13" height="6" fill="#c4a468"/>
  <rect x="1" y="10" width="16" height="8" fill="#c4a468"/>
  <rect x="19" y="10" width="13" height="8" fill="#aa8450"/>
  <!-- stone blocks bottom -->
  <rect x="16" y="30" width="14" height="8" fill="#aa8450"/>
  <rect x="32" y="30" width="14" height="8" fill="#c4a468"/>
  <rect x="16" y="40" width="14" height="7" fill="#c4a468"/>
  <rect x="32" y="40" width="14" height="7" fill="#aa8450"/>
  <!-- mortar -->
  <rect x="0" y="18" width="34" height="2" fill="#7a5a38"/>
  <rect x="14" y="28" width="34" height="2" fill="#7a5a38"/>
  <rect x="33" y="0" width="2" height="20" fill="#7a5a38"/>
  <rect x="13" y="28" width="2" height="20" fill="#7a5a38"/>
</svg>
