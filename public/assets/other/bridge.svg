<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" shape-rendering="crispEdges">
  <!-- water under bridge -->
  <rect x="0" y="18" width="48" height="14" fill="#1a5a9a"/>
  <rect x="0" y="20" width="48" height="10" fill="#2878c8"/>
  <!-- ripples -->
  <rect x="4" y="22" width="8" height="2" fill="#4a9ade" opacity="0.7"/>
  <rect x="18" y="24" width="12" height="2" fill="#4a9ade" opacity="0.7"/>
  <rect x="34" y="22" width="10" height="2" fill="#4a9ade" opacity="0.7"/>
  <!-- arch supports left -->
  <rect x="4" y="14" width="8" height="18" fill="#7a5a38"/>
  <rect x="5" y="15" width="6" height="16" fill="#8a6a48"/>
  <!-- arch supports right -->
  <rect x="36" y="14" width="8" height="18" fill="#7a5a38"/>
  <rect x="37" y="15" width="6" height="16" fill="#8a6a48"/>
  <!-- arch left -->
  <rect x="4" y="10" width="14" height="6" fill="#8a6a48"/>
  <rect x="4" y="8" width="12" height="4" fill="#9a7a58"/>
  <rect x="6" y="6" width="8" height="4" fill="#9a7a58"/>
  <!-- arch right -->
  <rect x="30" y="10" width="14" height="6" fill="#8a6a48"/>
  <rect x="34" y="8" width="12" height="4" fill="#9a7a58"/>
  <rect x="34" y="6" width="8" height="4" fill="#9a7a58"/>
  <!-- arch opening -->
  <rect x="12" y="12" width="8" height="6" fill="#2878c8"/>
  <rect x="28" y="12" width="8" height="6" fill="#2878c8"/>
  <!-- bridge road surface -->
  <rect x="0" y="6" width="48" height="8" fill="#9a8060"/>
  <rect x="0" y="7" width="48" height="6" fill="#aa9070"/>
  <!-- planks/stones -->
  <rect x="0" y="7" width="10" height="3" fill="#b8a07a"/>
  <rect x="12" y="7" width="10" height="3" fill="#9a8060"/>
  <rect x="24" y="7" width="10" height="3" fill="#b8a07a"/>
  <rect x="36" y="7" width="10" height="3" fill="#9a8060"/>
  <rect x="0" y="11" width="8" height="3" fill="#9a8060"/>
  <rect x="10" y="11" width="10" height="3" fill="#b8a07a"/>
  <rect x="22" y="11" width="10" height="3" fill="#9a8060"/>
  <rect x="34" y="11" width="10" height="3" fill="#b8a07a"/>
  <!-- plank lines -->
  <rect x="10" y="6" width="2" height="8" fill="#7a6040"/>
  <rect x="22" y="6" width="2" height="8" fill="#7a6040"/>
  <rect x="34" y="6" width="2" height="8" fill="#7a6040"/>
  <!-- railings left side -->
  <rect x="0" y="2" width="48" height="3" fill="#6a4a28"/>
  <rect x="0" y="3" width="48" height="1" fill="#8a6a48"/>
  <!-- railing posts -->
  <rect x="6" y="0" width="3" height="6" fill="#6a4a28"/>
  <rect x="16" y="0" width="3" height="6" fill="#6a4a28"/>
  <rect x="26" y="0" width="3" height="6" fill="#6a4a28"/>
  <rect x="36" y="0" width="3" height="6" fill="#6a4a28"/>
</svg>
