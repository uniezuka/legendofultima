<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" shape-rendering="crispEdges">
  <!-- shadow -->
  <rect x="4" y="28" width="32" height="4" fill="#1a1a1a" opacity="0.3"/>
  <!-- bush stems -->
  <rect x="12" y="22" width="4" height="8" fill="#3a5a28"/>
  <rect x="24" y="24" width="4" height="6" fill="#3a5a28"/>
  <rect x="18" y="26" width="4" height="4" fill="#3a5a28"/>
  <!-- left blob -->
  <rect x="2" y="10" width="20" height="16" fill="#2a5a20"/>
  <rect x="4" y="8" width="18" height="16" fill="#3a6a28"/>
  <rect x="6" y="6" width="14" height="14" fill="#4a7a38"/>
  <rect x="4" y="12" width="16" height="10" fill="#4a7a38"/>
  <!-- right blob -->
  <rect x="18" y="12" width="20" height="16" fill="#2a5a20"/>
  <rect x="20" y="10" width="18" height="16" fill="#3a6a28"/>
  <rect x="22" y="8" width="14" height="14" fill="#4a7a38"/>
  <rect x="20" y="14" width="16" height="10" fill="#4a7a38"/>
  <!-- center overlap -->
  <rect x="14" y="10" width="12" height="16" fill="#3a7030"/>
  <rect x="16" y="8" width="8" height="16" fill="#4a8040"/>
  <!-- berries -->
  <rect x="8" y="14" width="3" height="3" fill="#cc2222"/>
  <rect x="9" y="15" width="1" height="1" fill="#ff4444"/>
  <rect x="20" y="12" width="3" height="3" fill="#cc2222"/>
  <rect x="21" y="13" width="1" height="1" fill="#ff4444"/>
  <rect x="30" y="16" width="3" height="3" fill="#cc2222"/>
  <rect x="31" y="17" width="1" height="1" fill="#ff4444"/>
  <rect x="14" y="18" width="3" height="3" fill="#cc8800"/>
  <rect x="15" y="19" width="1" height="1" fill="#ffaa00"/>
  <!-- highlights -->
  <rect x="6" y="8" width="6" height="3" fill="#6aaa55" opacity="0.5"/>
  <rect x="22" y="10" width="6" height="3" fill="#6aaa55" opacity="0.5"/>
  <rect x="16" y="8" width="4" height="2" fill="#7abb65" opacity="0.6"/>
</svg>
