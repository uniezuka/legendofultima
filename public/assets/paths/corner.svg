<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- path tile base -->
  <rect width="48" height="48" fill="#1a1a1a"/>
  <!-- corner L-shape path: top + right -->
  <!-- horizontal portion (bottom-left to center) -->
  <rect x="0" y="14" width="34" height="20" fill="#b8955a"/>
  <rect x="0" y="15" width="34" height="18" fill="#c4a468"/>
  <!-- vertical portion (center to top) -->
  <rect x="14" y="0" width="20" height="34" fill="#b8955a"/>
  <rect x="15" y="0" width="18" height="34" fill="#c4a468"/>
  <!-- corner fill smooth -->
  <rect x="14" y="14" width="20" height="20" fill="#c4a468"/>
  <!-- stone blocks horizontal -->
  <rect x="1" y="16" width="12" height="6" fill="#aa8450"/>
  <rect x="1" y="24" width="12" height="7" fill="#c4a468"/>
  <!-- stone blocks vertical -->
  <rect x="16" y="1" width="8" height="12" fill="#aa8450"/>
  <rect x="26" y="1" width="7" height="12" fill="#c4a468"/>
  <!-- mortar -->
  <rect x="13" y="14" width="2" height="20" fill="#7a5a38"/>
  <rect x="14" y="13" width="20" height="2" fill="#7a5a38"/>
  <rect x="0" y="33" width="34" height="2" fill="#7a5a38"/>
  <rect x="33" y="14" width="2" height="20" fill="#7a5a38"/>
</svg>
