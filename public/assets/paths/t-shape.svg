<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- path tile base -->
  <rect width="48" height="48" fill="#1a1a1a"/>
  <!-- T-shape: horizontal + vertical down -->
  <!-- horizontal strip -->
  <rect x="0" y="14" width="48" height="20" fill="#b8955a"/>
  <rect x="0" y="15" width="48" height="18" fill="#c4a468"/>
  <!-- vertical strip down from center -->
  <rect x="14" y="14" width="20" height="34" fill="#b8955a"/>
  <rect x="15" y="14" width="18" height="34" fill="#c4a468"/>
  <!-- T-junction center fill -->
  <rect x="14" y="14" width="20" height="20" fill="#c4a468"/>
  <!-- stone blocks horizontal left -->
  <rect x="1" y="16" width="12" height="7" fill="#aa8450"/>
  <rect x="1" y="25" width="12" height="7" fill="#c4a468"/>
  <!-- stone blocks horizontal right -->
  <rect x="35" y="16" width="12" height="7" fill="#aa8450"/>
  <rect x="35" y="25" width="12" height="7" fill="#c4a468"/>
  <!-- stone blocks vertical -->
  <rect x="16" y="35" width="7" height="12" fill="#aa8450"/>
  <rect x="25" y="35" width="7" height="12" fill="#c4a468"/>
  <!-- mortar -->
  <rect x="0" y="13" width="48" height="2" fill="#7a5a38"/>
  <rect x="0" y="33" width="48" height="2" fill="#7a5a38"/>
  <rect x="13" y="33" width="2" height="15" fill="#7a5a38"/>
  <rect x="33" y="33" width="2" height="15" fill="#7a5a38"/>
</svg>
