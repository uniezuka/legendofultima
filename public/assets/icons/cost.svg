<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- gold coin - cost -->
  <rect x="4" y="2" width="16" height="4" fill="#c8a000"/>
  <rect x="2" y="4" width="20" height="16" fill="#e8c000"/>
  <rect x="3" y="3" width="18" height="18" fill="#e8c020"/>
  <rect x="4" y="2" width="16" height="20" fill="#f0c830"/>
  <!-- coin face -->
  <rect x="5" y="3" width="14" height="18" fill="#f8d840"/>
  <rect x="6" y="4" width="12" height="16" fill="#fae050"/>
  <!-- G symbol on coin -->
  <rect x="9" y="7" width="6" height="2" fill="#c8a000"/>
  <rect x="8" y="9" width="2" height="6" fill="#c8a000"/>
  <rect x="9" y="15" width="6" height="2" fill="#c8a000"/>
  <rect x="14" y="11" width="2" height="4" fill="#c8a000"/>
  <rect x="12" y="11" width="4" height="2" fill="#c8a000"/>
  <!-- rim -->
  <rect x="2" y="4" width="2" height="16" fill="#c8a000"/>
  <rect x="20" y="4" width="2" height="16" fill="#c8a000"/>
  <rect x="4" y="2" width="16" height="2" fill="#c8a000"/>
  <rect x="4" y="20" width="16" height="2" fill="#c8a000"/>
  <!-- shine -->
  <rect x="7" y="5" width="4" height="2" fill="#ffffff" opacity="0.4"/>
  <rect x="7" y="5" width="2" height="4" fill="#ffffff" opacity="0.3"/>
</svg>
