<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- path tile base -->
  <rect width="48" height="48" fill="#1a1a1a"/>
  <!-- horizontal strip -->
  <rect x="0" y="14" width="48" height="20" fill="#b8955a"/>
  <rect x="0" y="15" width="48" height="18" fill="#c4a468"/>
  <!-- vertical strip -->
  <rect x="14" y="0" width="20" height="48" fill="#b8955a"/>
  <rect x="15" y="0" width="18" height="48" fill="#c4a468"/>
  <!-- center fill -->
  <rect x="14" y="14" width="20" height="20" fill="#c4a468"/>
  <!-- stone blocks in each arm -->
  <!-- left -->
  <rect x="1" y="16" width="11" height="6" fill="#aa8450"/>
  <rect x="1" y="24" width="11" height="6" fill="#c4a468"/>
  <!-- right -->
  <rect x="36" y="16" width="11" height="6" fill="#aa8450"/>
  <rect x="36" y="24" width="11" height="6" fill="#c4a468"/>
  <!-- top -->
  <rect x="16" y="1" width="6" height="11" fill="#aa8450"/>
  <rect x="24" y="1" width="6" height="11" fill="#c4a468"/>
  <!-- bottom -->
  <rect x="16" y="36" width="6" height="11" fill="#aa8450"/>
  <rect x="24" y="36" width="6" height="11" fill="#c4a468"/>
  <!-- mortar outline of arms -->
  <rect x="0" y="13" width="14" height="2" fill="#7a5a38"/>
  <rect x="34" y="13" width="14" height="2" fill="#7a5a38"/>
  <rect x="0" y="33" width="14" height="2" fill="#7a5a38"/>
  <rect x="34" y="33" width="14" height="2" fill="#7a5a38"/>
  <rect x="13" y="0" width="2" height="14" fill="#7a5a38"/>
  <rect x="33" y="0" width="2" height="14" fill="#7a5a38"/>
  <rect x="13" y="34" width="2" height="14" fill="#7a5a38"/>
  <rect x="33" y="34" width="2" height="14" fill="#7a5a38"/>
</svg>
