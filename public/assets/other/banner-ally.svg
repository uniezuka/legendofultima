<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" shape-rendering="crispEdges">
  <!-- pole -->
  <rect x="14" y="2" width="4" height="44" fill="#8a6a30"/>
  <rect x="15" y="2" width="2" height="44" fill="#b08840"/>
  <!-- banner flag -->
  <rect x="18" y="3" width="14" height="18" fill="#1a3a9a"/>
  <rect x="19" y="4" width="12" height="16" fill="#2244bb"/>
  <!-- flag swallow tail cut -->
  <rect x="27" y="12" width="5" height="6" fill="#1a1a3a"/>
  <!-- shield emblem on flag -->
  <rect x="21" y="6" width="8" height="10" fill="#4466dd"/>
  <rect x="22" y="7" width="6" height="8" fill="#5577ee"/>
  <!-- cross on emblem -->
  <rect x="24" y="7" width="2" height="8" fill="#2244bb"/>
  <rect x="22" y="10" width="6" height="2" fill="#2244bb"/>
  <!-- flag shine -->
  <rect x="20" y="5" width="4" height="2" fill="#88aaff" opacity="0.5"/>
  <!-- flag tip -->
  <rect x="14" y="0" width="4" height="4" fill="#c8a840"/>
  <rect x="15" y="0" width="2" height="3" fill="#f0d060"/>
  <!-- banner fringe at bottom -->
  <rect x="18" y="21" width="2" height="4" fill="#1a3a9a"/>
  <rect x="22" y="21" width="2" height="5" fill="#1a3a9a"/>
  <rect x="26" y="21" width="2" height="4" fill="#1a3a9a"/>
  <rect x="30" y="21" width="2" height="5" fill="#1a3a9a"/>
</svg>
